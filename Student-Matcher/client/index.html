<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>เฉลยพี่เทคน้องเทค</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --rosewood:#70020F;
      --misty:#FFDEE2;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --border:#f3c6cc;
      --shadow: 0 18px 40px rgba(112,2,15,.20);
      --shadow2: 0 10px 24px rgba(0,0,0,.06);
      --radius: 18px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:"Sarabun",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      color:var(--text);
      background: radial-gradient(1200px 600px at 20% 10%, rgba(112,2,15,.10), transparent 60%),
                  radial-gradient(900px 500px at 90% 20%, rgba(112,2,15,.08), transparent 55%),
                  var(--misty);
      min-height:100vh;
    }

    .wrap{ max-width: 1180px; margin: 36px auto 24px; padding: 0 18px; }

    .hero{
      padding: 18px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.72));
      box-shadow: var(--shadow2);
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
      flex-wrap: wrap;
      position: relative;
      overflow:hidden;
    }
    .hero::before{
      content:"";
      position:absolute;
      inset:-120px -140px auto auto;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle at 30% 30%, rgba(112,2,15,.20), transparent 60%);
      transform: rotate(12deg);
      pointer-events:none;
    }

    .title{ display:flex; gap:12px; align-items:center; position:relative; z-index:1; }
    .logo{
      width: 44px; height: 44px; border-radius: 14px;
      background: linear-gradient(135deg, var(--rosewood), #9b0b1e);
      box-shadow: 0 10px 22px rgba(112,2,15,.25);
      display:grid; place-items:center;
      color:#fff; font-weight:900; letter-spacing:.5px;
    }
    h1{ margin:0; color:var(--rosewood); font-size: 24px; line-height:1.1; }
    .sub{ margin:6px 0 0; color:var(--muted); font-size: 13px; }

    .pill{
      position:relative; z-index:1;
      display:inline-flex; align-items:center; gap:8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(112,2,15,.08);
      border: 1px solid rgba(112,2,15,.16);
      color: var(--rosewood);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .card{
      margin-top: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .row{ display:flex; gap:10px; flex-wrap: wrap; align-items:center; }

    select, input, button{
      font-family: inherit;
      font-size: 15px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      background: #fff;
      outline: none;
    }
    select{ flex: 1 1 360px; }
    input{ flex: 1 1 240px; }

    input:focus, select:focus{
      border-color: rgba(112,2,15,.35);
      box-shadow: 0 0 0 4px rgba(112,2,15,.10);
    }

    button{
      border:none;
      background: linear-gradient(135deg, var(--rosewood), #9b0b1e);
      color:#fff;
      cursor:pointer;
      font-weight: 900;
      box-shadow: 0 12px 22px rgba(112,2,15,.22);
      display:inline-flex;
      align-items:center;
      gap: 10px;
    }
    button:hover{ filter: brightness(.97); transform: translateY(-1px); }
    button:active{ transform: translateY(0px); }

    .ghost{
      background: rgba(112,2,15,.08);
      color: var(--rosewood);
      border: 1px solid rgba(112,2,15,.18);
      box-shadow: none;
      font-weight: 900;
    }

    .status{ margin-top: 10px; font-size: 13px; color: var(--muted); }
    .status.ok{ color:#065f46; }
    .status.err{ color:#b00020; font-weight:800; }

    .tools{
      display:flex; gap:10px; flex-wrap: wrap;
      margin-top: 10px;
      align-items:center;
      justify-content: space-between;
    }
    .toolsLeft{ display:flex; gap:10px; flex-wrap: wrap; }
    .tiny{ font-size: 12px; color: var(--muted); }

    table{
      width:100%;
      border-collapse: collapse;
      margin-top: 12px;
      overflow:hidden;
      border-radius: 14px;
      border: 1px solid var(--border);
      background:#fff;
    }
    th, td{
      text-align:left;
      padding: 10px 10px;
      border-bottom: 1px solid #f4d2d7;
      font-size: 13px;
      vertical-align: top;
      white-space: nowrap;
    }
    td.wrapcol{ white-space: normal; min-width: 220px; }
    th{
      background: rgba(112,2,15,.08);
      color: var(--rosewood);
      font-weight: 900;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    tr:hover td{ background: rgba(255,222,226,.35); }

    footer{ text-align:center; margin: 16px 0 8px; color: rgba(112,2,15,.82); font-size: 13px; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="hero">
      <div class="title">
        <div class="logo">❤️‍🔥</div>
        <div>
          <h1>พี่เทคน้องเทค</h1>
          <div class="sub">ค้นหาคนที่เทค และ คนที่ได้เทค</div>
        </div>
      </div>
      <div class="pill">💞</div>
    </div>

    <div class="card">
      <div class="row">
        <select id="mode">
          <option value="senior_to_junior">พี่เทคน้อง (ม.4–6 → ม.1–3)</option>
          <option value="junior_to_senior">น้องเทคพี่ (ม.1–3 → ม.4–6)</option>
        </select>

        <input id="search" placeholder="ค้นหา: ชื่อ/นามสกุล/รหัส/ห้อง (เช่น 673045 หรือ ม.2/3)" />
        <button id="btn">แสดงผล <span aria-hidden="true">→</span></button>
      </div>

      <div id="status" class="status">พร้อมใช้งาน (กด “แสดงผล” หรือพิมพ์แล้วกด Enter)</div>

      <div class="tools" id="tools" style="display:none;">
        <div class="toolsLeft">
          <button class="ghost" id="copyBtn" type="button">คัดลอกทั้งหมด</button>
          <button class="ghost" id="downloadBtn" type="button">ดาวน์โหลด CSV</button>
        </div>
        <div class="tiny" id="countText"></div>
      </div>

      <div style="overflow:auto;">
        <table id="tbl" style="display:none;">
          <thead>
            <tr>
              <th>#</th>
              <th>ผู้เทค (Caretaker)</th>
              <th>รหัส</th>
              <th>ห้อง/เลขที่</th>
              <th>ได้เทค (Receiver)</th>
              <th>รหัส</th>
              <th>ห้อง/เลขที่</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <footer>จัดทำโดย <b>SAPA14</b></footer>
  </div>

<script>
  // ===== Simple CSV parser (commas only) =====
  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    const headers = lines[0].split(",").map(h => h.trim());
    return lines.slice(1).filter(Boolean).map(line => {
      const cells = line.split(",").map(c => c.trim());
      const obj = {};
      headers.forEach((h, i) => obj[h] = cells[i] ?? "");
      return obj;
    });
  }

  const norm = (x) => String(x ?? "").trim();

  function formatFullName(u) {
    const role = norm(u.role);
    const name = norm(u.name);
    const surname = norm(u.surname);
    return `${role} ${name} ${surname}`.replace(/\s+/g, " ").trim();
  }

  function formatClass(clsRaw) {
    const s = norm(clsRaw);
    const n = Number(s);
    if (Number.isFinite(n) && s !== "") {
      const grade = Math.floor(n / 100);
      const room = n % 100;
      return `ม.${grade}/${room}`;
    }
    return s; // ถ้าไม่ใช่เลข ก็แสดงตามเดิม
  }

  function roomNoText(u){
    const c = formatClass(u["class"]);
    const no = norm(u.number) || "-";
    return `${c} • เลขที่ ${no}`;
  }

  let users = [];
  let pairs = [];
  let lastRows = [];

  function findUserById(id){
    const sid = norm(id);
    return users.find(u => norm(u.student_id) === sid);
  }

  async function loadData(){
    const [uText, pText] = await Promise.all([
      fetch("./user.csv").then(r => r.text()),
      fetch("./pairs_all.csv").then(r => r.text()),
    ]);
    users = parseCSV(uText);
    pairs = parseCSV(pText);
  }

  function buildRows(mode, queryRaw){
    const q = norm(queryRaw).toLowerCase();
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    const list = pairs.filter(p => norm(p.type) === mode);

    const enriched = list.map(p => {
      const caretakerId = norm(p.caretaker_student_id);
      const receiverId  = norm(p.receiver_student_id);
      const cu = findUserById(caretakerId);
      const ru = findUserById(receiverId);

      const caretakerName = cu ? formatFullName(cu) : "(ไม่พบใน user.csv)";
      const receiverName  = ru ? formatFullName(ru) : "(ไม่พบใน user.csv)";
      const caretakerRoom = cu ? roomNoText(cu) : "-";
      const receiverRoom  = ru ? roomNoText(ru) : "-";

      const hay = [
        caretakerId, receiverId,
        caretakerName, receiverName,
        caretakerRoom, receiverRoom,
        // ช่วยให้ค้นหา "ม.2/3" ได้
        cu ? formatClass(cu["class"]) : "",
        ru ? formatClass(ru["class"]) : ""
      ].join(" ").toLowerCase();

      return {
        type: norm(p.type),
        caretaker_student_id: caretakerId,
        receiver_student_id: receiverId,
        caretakerName, receiverName,
        caretakerRoom, receiverRoom,
        hay
      };
    });

    const filtered = !q ? enriched : enriched.filter(r => r.hay.includes(q));

    filtered.forEach((r, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${i+1}</td>
        <td class="wrapcol">${r.caretakerName}</td>
        <td>${r.caretaker_student_id}</td>
        <td>${r.caretakerRoom}</td>
        <td class="wrapcol">${r.receiverName}</td>
        <td>${r.receiver_student_id}</td>
        <td>${r.receiverRoom}</td>
      `;
      tbody.appendChild(tr);
    });

    return filtered;
  }

  function toCSV(rows){
    const header = ["type","caretaker_student_id","receiver_student_id"].join(",");
    const lines = rows.map(r => [r.type, r.caretaker_student_id, r.receiver_student_id].join(","));
    return [header, ...lines].join("\n");
  }

  function downloadText(filename, text){
    const blob = new Blob([text], {type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  async function showAll(){
    const status = document.getElementById("status");
    const mode = document.getElementById("mode").value;
    const search = document.getElementById("search").value;

    try{
      status.className = "status";
      status.textContent = "กำลังโหลดข้อมูล…";
      await loadData();

      lastRows = buildRows(mode, search);

      document.getElementById("tbl").style.display = "";
      document.getElementById("tools").style.display = "flex";
      document.getElementById("countText").textContent = `แสดง ${lastRows.length} แถว`;

      status.className = "status ok";
      status.textContent = `แสดงผลแล้ว ✅`;

    } catch(e){
      status.className = "status err";
      status.textContent = "โหลดไฟล์ไม่สำเร็จ: ตรวจว่า user.csv และ pairs_all.csv อยู่ถูกที่";
      document.getElementById("tbl").style.display = "none";
      document.getElementById("tools").style.display = "none";
    }
  }

  document.getElementById("btn").addEventListener("click", showAll);

  document.getElementById("search").addEventListener("keydown", (e) => {
    if (e.key === "Enter") showAll();
  });

  document.getElementById("copyBtn").addEventListener("click", async () => {
    if (!lastRows.length) return;
    const status = document.getElementById("status");
    const text = lastRows
      .map((r, i) => `${i+1}. ${r.caretaker_student_id} (${r.caretakerName}) -> ${r.receiver_student_id} (${r.receiverName})`)
      .join("\n");
    try{
      await navigator.clipboard.writeText(text);
      status.className = "status ok";
      status.textContent = "คัดลอกแล้ว ✅";
      setTimeout(()=> status.textContent = "แสดงผลแล้ว ✅", 1200);
    }catch(e){
      status.className = "status err";
      status.textContent = "คัดลอกไม่สำเร็จ (บางเบราว์เซอร์ไม่อนุญาต)";
    }
  });

  document.getElementById("downloadBtn").addEventListener("click", () => {
    if (!lastRows.length) return;
    const mode = document.getElementById("mode").value;
    downloadText(`answer_${mode}.csv`, toCSV(lastRows));
  });

  // โหลดครั้งแรกแบบไม่โชว์ตารางจนกดปุ่ม
</script>
</body>
</html>
